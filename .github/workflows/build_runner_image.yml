name: Build & Publish CodeMender Runner Image

on:
  push:
    branches:
      - main
    paths:
      - '.github/codemender-runner/**'
      - '.github/workflows/build_runner_image.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/codemender-runner/**'
      - '.github/workflows/build_runner_image.yml'
  workflow_dispatch:
    inputs:
      cm_version:
        description: 'Specific version/tag from Artifact Registry'
        required: false
        default: '0.11.0'
        type: string
      cm_custom_url:
        description: 'Optional direct download URL for custom/rollback binary'
        required: false
        default: ''
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Runner Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .github/codemender-runner
          load: true
          tags: codemender-runner:test
          build-args: |
            CM_VERSION=${{ inputs.cm_version || '0.11.0' }}
            CM_URL=${{ inputs.cm_custom_url || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Image Contract
        run: |
          ENTRYPOINT=$(docker inspect --format='{{json .Config.Entrypoint}}' codemender-runner:test)
          CMD=$(docker inspect --format='{{json .Config.Cmd}}' codemender-runner:test)
          echo "Entrypoint: $ENTRYPOINT"
          echo "Cmd: $CMD"
          test "$ENTRYPOINT" = '["cm-runner"]'
          test "$CMD" = '["version"]'

      - name: Verify Version Command
        run: |
          docker run --rm codemender-runner:test version

      - name: Push Runner Image
        if: github.event_name != 'pull_request'
        run: |
          docker tag codemender-runner:test ghcr.io/${{ github.repository_owner }}/codemender-runner:latest
          docker tag codemender-runner:test ghcr.io/${{ github.repository_owner }}/codemender-runner:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/codemender-runner:latest
          docker push ghcr.io/${{ github.repository_owner }}/codemender-runner:${{ github.sha }}
