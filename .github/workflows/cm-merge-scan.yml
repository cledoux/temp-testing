# Workflow template: copy this file to `.github/workflows/cm-merge-scan.yml` in
# the repository you want CodeMender to run on.
#
# Prerequisite: the package's `actions/codemender/` directory has been copied
# into this repository at `.github/actions/codemender/` (see README.md in the package → "Using it in a
# repository"). The workflow runs that local copy; it does not reference the
# codemender-runner repository.
#
# M0 (walking skeleton): every pull request gets one CodeMender comment showing
# that cm-runner started and which versions it runs. No GCP setup is needed yet.

name: CodeMender

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Target (base) branches to scan. Adjust to your default/release branches.
    branches: [main, master]

# One run per PR; a new push cancels the previous, now-stale run.
concurrency:
  group: codemender-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read        # Check out this repo (needed to find the local action)
  packages: read        # Pull the cm-runner image from GHCR
  pull-requests: write  # Post / update the CodeMender PR comment

jobs:
  codemender:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Required: the action lives in this repository, so it must be checked
      # out first. `persist-credentials: false` keeps the token out of .git/config.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/codemender
        with:
          # Required: a cm-runner image this repository can pull, pinned to a
          # commit SHA tag. Replace with your own registry/image.
          runner_image: <your-registry>/codemender-runner:<commit-sha>
          # log_level: debug
